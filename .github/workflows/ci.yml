name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build packages solution
        run: dotnet build packages/Lamina.slnx -c Release -warnaserror
      - name: Build Folio solution
        run: dotnet build folio/Folio.slnx -c Release -warnaserror

  outdated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore local tools
        run: dotnet tool restore
      - name: Check for outdated packages
        # Blocks on push and nightly; only warns on pull requests (Plan.md §9.2).
        env:
          BLOCKING: ${{ github.event_name != 'pull_request' }}
        run: |
          # Held back on purpose (Plan.md §9.2):
          # - Aspire 17 obsoletes Aspire.AppHost.Sdk and Projects.* references (ASPIRE012), which
          #   Folio's AppHost and Sut.Aspire rely on. Phase 1 stays on Aspire 13.6.
          # - EF Core 11 targets net11.0 only; Folio is net10.0.
          # - Microsoft.CodeAnalysis.CSharp 5.0.0 is the channel generator's compiler baseline
          #   (.NET 10 GA), so the generator loads on every SDK 10 compiler.
          # - Verify 33 fails the build (SC021) until the owner declares a Verify
          #   maintenance-fee sponsorship or exemption.
          packages_excludes=(--exclude Aspire. --exclude Microsoft.CodeAnalysis. --exclude Verify)
          folio_excludes=(--exclude Aspire. --exclude Microsoft.EntityFrameworkCore. --exclude Microsoft.CodeAnalysis.)
          status=0
          for solution in packages/Lamina.slnx folio/Folio.slnx; do
            report="$RUNNER_TEMP/outdated-$(basename "$solution" .slnx).md"
            excludes=("${packages_excludes[@]}")
            if [ "$solution" = "folio/Folio.slnx" ]; then excludes=("${folio_excludes[@]}"); fi
            if dotnet outdated "$solution" "${excludes[@]}" --fail-on-updates --output-format markdown --output "$report"; then
              echo "### \`$solution\`: all packages up to date" >> "$GITHUB_STEP_SUMMARY"
            else
              status=1
              echo "### \`$solution\`: outdated packages" >> "$GITHUB_STEP_SUMMARY"
              if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
            fi
            echo >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$status" -ne 0 ]; then
            if [ "$BLOCKING" = "true" ]; then
              echo "::error::Outdated packages found. See the job summary."
              exit 1
            fi
            echo "::warning::Outdated packages found. See the job summary. This does not block pull requests."
          fi

  unit-tests:
    needs: [build, outdated]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Run unit tests
        # Every project named *.Tests.csproj in either solution is a unit test project.
        # Lamina.IntegrationTests, Lamina.XunitV3.Tests.Samples and the acceptance Specs
        # projects don't match, so they stay out of this job. dotnet test runs in
        # Microsoft.Testing.Platform mode (global.json) and rebuilds each project.
        run: |
          mapfile -t projects < <(git ls-files '*.Tests.csproj')
          if [ "${#projects[@]}" -eq 0 ]; then
            echo "No unit test projects yet." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          status=0
          for project in "${projects[@]}"; do
            echo "::group::$project"
            # No -warnaserror here: in MTP mode dotnet test passes it to the test app, which
            # exits 5. TreatWarningsAsErrors in Directory.Build.props still applies.
            dotnet test --project "$project" -c Release || status=1
            echo "::endgroup::"
          done
          exit "$status"

  # The three jobs below run test projects with .github/scripts/run-xunit.sh, which uses each
  # project's own xUnit runner so Lamina's run-start and teardown lines reach the log, and
  # writes TRX, xUnit XML and the full host and resource logs to $TEST_RESULTS for upload.

  integration-tests:
    needs: [build, outdated]
    runs-on: ubuntu-latest
    env:
      TEST_RESULTS: ${{ github.workspace }}/test-results
      PROJECT: packages/tests/Lamina.IntegrationTests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build "$PROJECT" -c Release
      - name: Run integration tests
        # Needs Docker, which ubuntu-latest has.
        run: bash .github/scripts/run-xunit.sh "$PROJECT" integration-tests
      - name: Upload test results and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: integration-tests-results
          path: test-results/
          retention-days: 14

  acceptance-aspire:
    needs: [build, outdated]
    runs-on: ubuntu-latest
    env:
      TEST_RESULTS: ${{ github.workspace }}/test-results
      SPECS: folio/tests/Commerce/Folio.Commerce.Acceptance.Specs
      BROKEN_SPEC: Folio.Commerce.Acceptance.Specs.BrokenSpecs.StockNeverReachesWhatTheSpecExpects
      # Seconds. A cold runner pulls the Postgres and WireMock images during start-up.
      Lamina__Sut__ReadyTimeout: "300"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build "$SPECS" -c Release
      - name: Run the Commerce specs 50 times over through Sut.Aspire
        env:
          Lamina__Repeat: "50"
        run: |
          bash .github/scripts/run-xunit.sh "$SPECS" commerce-aspire
          python3 .github/scripts/check-results.py repeat "$TEST_RESULTS/commerce-aspire.xml" 50
      - name: Run the Broken spec on its own and check its failure message
        # Plan.md §10 criterion 2. Named by method, because BrokenSpecs holds more than one
        # explicit failing spec and only this one fails in Eventually.
        if: ${{ success() || failure() }}
        run: |
          if bash .github/scripts/run-xunit.sh "$SPECS" broken-spec -method "$BROKEN_SPEC" -explicit only; then
            echo "::error::The Broken spec passed. It must fail."
            exit 1
          fi
          python3 .github/scripts/check-results.py broken "$TEST_RESULTS/broken-spec.xml" "$BROKEN_SPEC"
      - name: Upload test results and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-aspire-results
          path: test-results/
          retention-days: 14

  acceptance-deployed:
    needs: [build, outdated]
    runs-on: ubuntu-latest
    env:
      TEST_RESULTS: ${{ github.workspace }}/test-results
      SPECS: folio/tests/Commerce/Folio.Commerce.Acceptance.Specs
      APPHOST: folio/src/Folio.AppHost
      # Seconds. Readiness polling waits while the AppHost pulls images and starts every service.
      Lamina__Sut__ReadyTimeout: "300"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build
        # The AppHost builds in Debug: dotnet run of an AppHost goes through the Aspire CLI,
        # which starts bin/Debug whatever -c says.
        run: |
          dotnet build "$SPECS" -c Release
          dotnet build "$APPHOST"
      - name: Start the Folio AppHost in the background
        run: |
          mkdir -p "$TEST_RESULTS"
          nohup dotnet run --project "$APPHOST" --launch-profile acceptance --no-build > "$TEST_RESULTS/apphost.log" 2>&1 &
          echo "APPHOST_PID=$!" >> "$GITHUB_ENV"
      - name: Run the Commerce specs through Sut.Deployed
        env:
          Lamina__Sut__Provider: deployed
        run: bash .github/scripts/run-xunit.sh "$SPECS" commerce-deployed
      - name: Collect container logs
        if: ${{ failure() }}
        run: |
          mkdir -p "$TEST_RESULTS/containers"
          docker ps -a > "$TEST_RESULTS/containers/ps.txt"
          for container in $(docker ps -aq); do
            name=$(docker inspect --format '{{.Name}}' "$container" | tr -d /)
            docker logs "$container" > "$TEST_RESULTS/containers/$name.log" 2>&1
          done
      - name: Stop the AppHost
        if: ${{ always() && env.APPHOST_PID != '' }}
        run: |
          kill -INT "$APPHOST_PID" || true
          timeout 60 tail --pid="$APPHOST_PID" -f /dev/null || true
      - name: Collect AppHost and service logs
        # The AppHost's console shows no resource logs. The Aspire CLI log has the resource state
        # changes; DCP's session folders hold each service's console output (<id>_out, with
        # resource-executable-<id>.log naming the project).
        if: ${{ failure() }}
        run: |
          cp -r ~/.aspire/logs "$TEST_RESULTS/aspire-cli-logs" || true
          mkdir -p "$TEST_RESULTS/dcp"
          cp -r "${TMPDIR:-/tmp}"/aspire-dcp* "$TEST_RESULTS/dcp/" || true
      - name: Upload test results and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-deployed-results
          path: test-results/
          retention-days: 14
